<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Farm Chat Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f4f4f4;
        }
        #chat {
            border: 1px solid #ccc;
            background: #fff;
            padding: 10px;
            height: 350px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        #input {
            width: 80%;
            padding: 8px;
        }
        button {
            padding: 8px 12px;
            margin-left: 5px;
        }
        #status {
            font-style: italic;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<h2>Farm Chat Game</h2>

<div id="chat"></div>

<input id="input" placeholder="Say something..." />
<button onclick="sendMessage()">Send</button>

<br><br>

<button onclick="fetchHistory()">Show History</button>
<button onclick="fetchImage()">Generate Image Prompt</button>

<div id="status"></div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const status = document.getElementById("status");

// Append message to chat window
function append(msg) {
    chat.innerHTML += `<div>${msg}</div>`;
    chat.scrollTop = chat.scrollHeight;
}

// Send chat message
async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    append("You: " + text);
    input.value = "";
    input.focus();

    status.textContent = "Jimmy is thinking...";

    const res = await fetch("/play", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    status.textContent = "";
    append("Jimmy: " + data.reply);
}

// Enter key to send
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
});

// Fetch history from Python API
async function fetchHistory() {
    const res = await fetch("/history");
    const data = await res.json();
    append("📜 History:<br><pre>" + data.history + "</pre>");
}

// Fetch image prompt from Python API
async function fetchImage() {
    const res = await fetch("/image");
    const data = await res.json();
    append("🖼️ Image Prompt:<br><pre>" + data.image_prompt + "</pre>");
}
</script>

</body>
</html>
