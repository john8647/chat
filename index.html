<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Game</title>
    <link rel="stylesheet" href="/resources/styles.css">
</head>
<body>

<div class="app">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">Characters</div>
        <div class="character-list">
           <div class="character-item active" data-name="Jimmy" onclick="selectCharacter('Jimmy', this)">
                <div class="avatar" style="background-image:url('/images/jimmy.png'); background-size:cover;"></div>
                <div class="character-name">Jimmy</div>
            </div>
            <div class="character-item" data-name="Sarah" onclick="selectCharacter('Sarah', this)">
                <div class="avatar" style="background-image:url('/images/sarah.png'); background-size:cover;"></div>
                <div class="character-name">Sarah</div>
            </div>
            <div class="character-item" data-name="Chloe" onclick="selectCharacter('Chloe', this)">
                <div class="avatar" style="background-image:url('/images/chloe.png'); background-size:cover;"></div>
                <div class="character-name">Chloe</div>
            </div>
        </div>
    </div>

    <!-- Chat area -->
    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-header-avatar" id="chatHeaderAvatar"></div>
            <div class="chat-header-info">
            <div class="chat-header-name" id="chatHeaderName">Jimmy</div>
            <div class="chat-header-status" id="chatHeaderStatus">Online</div>

        </div>
            
             <div class="chat-header-profile-toggle">
        <button id="profileBtn" onclick="openProfile()">Profile</button>
    </div>
        <!-- Profile Panel -->
<div id="profilePanel" class="profile-panel">
    <h3 id="profileName"></h3>

    <label>Persona</label>
    <textarea id="profilePersona"></textarea>

    <label>Mood</label>
    <input id="profileMood">

    <label>Outfit</label>
    <input id="profileOutfit">

    <label>Location</label>
    <input id="profileLocation">

    <label>Inventory (comma separated)</label>
    <input id="profileInventory">

    <button onclick="saveProfile()">Save</button>
    <button onclick="closeProfile()">Close</button>
</div>
</div>

        <div class="chat-window" id="chat"></div>
        <div class="input-area">
            <input id="input" placeholder="Type a message" />
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>




<!-- Modular JavaScript -->
<script src="/js/ui.js"></script>
<script src="/js/characters.js"></script>
<script src="/js/history.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/profile.js"></script>

</body>
</html>
